# ==============================================================================
# Baterias Estrela - Docker Compose para Produção na VPS
# ==============================================================================
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# ==============================================================================

services:
  # Banco de Dados Relacional PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: baterias_estrela_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baterias_estrela}
      POSTGRES_USER: ${POSTGRES_USER:-estrela_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - estrela_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-estrela_admin} -d $${POSTGRES_DB:-baterias_estrela}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Fastify Backend
  api:
    container_name: baterias_estrela_api_prod
    restart: always
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-estrela_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-baterias_estrela}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://bateriasestrela.com.br}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    ports:
      # O backend escuta na porta 3333 para proxy reverso do Nginx e chamadas externas
      - "0.0.0.0:3333:3333"
    volumes:
      - api_uploads:/app/uploads
    networks:
      - estrela_internal

volumes:
  postgres_data:
    name: baterias_estrela_pgdata_prod
  api_uploads:
    name: baterias_estrela_uploads_prod

networks:
  estrela_internal:
    name: baterias_estrela_network_prod
    driver: bridge
