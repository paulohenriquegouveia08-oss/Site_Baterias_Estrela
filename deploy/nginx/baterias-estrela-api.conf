# ==============================================================================
# Baterias Estrela - Configuração Nginx para Produção na VPS
# Arquivo: /etc/nginx/sites-available/baterias-estrela
# Ativar com: ln -s /etc/nginx/sites-available/baterias-estrela /etc/nginx/sites-enabled/
# ==============================================================================

# Limite de taxa de requisições por IP na borda (opcional, protege contra brute force)
limit_req_zone $binary_remote_addr zone=estrela_api_limit:10m rate=30r/s;

# ------------------------------------------------------------------------------
# OPÇÃO A: Subdomínio dedicado para a API (ex: api.bateriasestrela.com.br)
# Recomendado quando o frontend estiver na Vercel/Netlify/Cloudflare Pages
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.bateriasestrela.com.br;

    # Redireciona HTTP para HTTPS automaticamente
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.bateriasestrela.com.br;

    # Certificados SSL Certbot / Let's Encrypt (substitua pelo seu domínio)
    ssl_certificate /etc/letsencrypt/live/api.bateriasestrela.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bateriasestrela.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Cabeçalhos de Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Tamanho máximo de upload (para fotos de produtos até 5MB e CSVs)
    client_max_body_size 15M;

    # Compactação Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Logs de acesso e erro
    access_log /var/log/nginx/baterias_estrela_api_access.log;
    error_log /var/log/nginx/baterias_estrela_api_error.log;

    # Rota raiz e API REST versionada
    location / {
        limit_req zone=estrela_api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;

        # Preserva cabeçalhos de conexão e IP real do visitante
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts para uploads e relatórios
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

